  url: https://jhico.org/map/

- name: mapmap.tokyo
  description: レイヤを重ねることに特化した地図ビューアの開発。
  descriptionEn: A map viewer specialized in overlaying layers.
  url: https://mapmap.tokyo

- name: 到達圏連続表示QGISプラグイン
